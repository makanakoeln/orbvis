name: Shell Scripts CI

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install_cmk.sh'
      - 'make_mkp.sh'
      - 'scripts/**'
      - '.github/workflows/scripts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install_cmk.sh'
      - 'make_mkp.sh'
      - 'scripts/**'
      - '.github/workflows/scripts.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck install.sh

      - name: Lint install_cmk.sh
        run: shellcheck install_cmk.sh

      - name: Lint make_mkp.sh
        run: shellcheck make_mkp.sh

      - name: Lint scripts/orbvis-setup
        run: shellcheck scripts/orbvis-setup

      - name: Lint scripts/orbvis-install
        run: shellcheck scripts/orbvis-install
