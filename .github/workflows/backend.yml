name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # OrbVis's form_specs/* import cmk.rulesets.v1 at module load. The
      # package is not on PyPI — it lives in checkmk/packages/cmk-plugin-apis/
      # and is provided by OMD in real deployments. For CI we sparse-clone the
      # checkmk repo and put the package directory on PYTHONPATH, mirroring
      # the local dev setup (CMK_PLUGIN_APIS env in tools/release-test/standalone).
      CMK_REF: master
      CMK_APIS: ${{ github.workspace }}/_cmk-plugin-apis
      PYTHONPATH: ${{ github.workspace }}/_cmk-plugin-apis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Fetch cmk-plugin-apis (form_specs runtime dep)
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
              --branch "$CMK_REF" \
              https://github.com/Checkmk/checkmk.git _cmk-src
          cd _cmk-src
          git sparse-checkout init --cone
          git sparse-checkout set packages/cmk-plugin-apis
          git checkout
          mv packages/cmk-plugin-apis "$CMK_APIS"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check app/

      - name: Lint
        run: ruff check app/

      - name: Type check
        # mypy config lives in the repo-root pyproject.toml (checkmk-strict).
        # Must run from the repo root so the correct config is discovered.
        working-directory: ${{ github.workspace }}
        run: mypy backend/app

      - name: Security scan (bandit)
        run: bandit -r app/ -x tests/ -ll

      - name: Dependency audit (pip-audit)
        # Audit project dependencies declared in pyproject.toml only — auditing
        # the full env would also flag vulnerabilities in build tools like pip
        # itself, which we cannot fix from this repo.
        run: |
          pip install pip-audit
          pip-audit .

      - name: Test + coverage gate
        # Baseline ~50%; Folge-PRs heben die Schwelle stufenweise in Richtung 75%.
        # Gate bewusst unter dem aktuellen Stand, damit kein Zufallsbruch.
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=45

  docker-build-backend:
    runs-on: ubuntu-latest

    env:
      CMK_REF: master
      CMK_APIS: ${{ github.workspace }}/_cmk-plugin-apis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        run: docker build . -f backend/Dockerfile --tag orbvis-backend:test

      - name: Fetch cmk-plugin-apis (form_specs runtime dep)
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
              --branch "$CMK_REF" \
              https://github.com/Checkmk/checkmk.git _cmk-src
          cd _cmk-src
          git sparse-checkout init --cone
          git sparse-checkout set packages/cmk-plugin-apis
          git checkout
          mv packages/cmk-plugin-apis "$CMK_APIS"

      - name: Smoke test backend image
        # ENVIRONMENT=testing skips app.core.config's production SECRET_KEY check.
        # PYTHONPATH/-v mounts cmk-plugin-apis read-only — backend/Dockerfile
        # intentionally does NOT install it (OMD provides cmk in production;
        # standalone uses tools/release-test/standalone/backend.Dockerfile
        # which installs from a build context).
        run: |
          docker run --rm \
            -e ENVIRONMENT=testing \
            -e PYTHONPATH=/cmk-apis \
            -v "$CMK_APIS:/cmk-apis:ro" \
            orbvis-backend:test \
            python -c "from app.main import app; print('OK')"
