name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check app/

      - name: Lint
        run: ruff check app/

      - name: Type check
        run: mypy app/

      - name: Security scan (bandit)
        run: bandit -r app/ -x tests/ -ll

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln CVE-2026-4539

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  docker-build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build ./backend --tag orbvis-backend:test

      - name: Smoke test backend image
        run: docker run --rm orbvis-backend:test python -c "from app.main import app; print('OK')"
