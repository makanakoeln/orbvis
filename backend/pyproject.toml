[project]
name = "orbvis-backend"
version = "0.1.0"
description = "OrbVis Backend - FastAPI based monitoring visualization"
license = { text = "BUSL-1.1" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-jose>=3.3.0",
    "bandit>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",   # line-length vom Formatter gehandhabt
    "B008",   # Depends()-Aufrufe in Default-Args (FastAPI-Pattern)
    "E402",   # module-level import not at top — intentional in main.py (class before local imports)
    "RUF001", # ambiguous EN DASH in strings — intentional prose
    "RUF002", # ambiguous EN DASH in docstrings — intentional prose
    "RUF003", # ambiguous EN DASH in comments — intentional prose
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]
