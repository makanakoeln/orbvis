services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8000"
    volumes:
      - ./data/maps:/app/maps
      - orbvis_db:/app/data
    environment:
      - MAPS_DIR=/app/maps
      - DATABASE_URL=sqlite+aiosqlite:////app/data/orbvis.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ORBVIS_PORT=${ORBVIS_PORT:-8082}
      - ALLOWED_ORIGINS=["http://localhost"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "${ORBVIS_PORT:-8082}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  orbvis_db:
