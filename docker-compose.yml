services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data/maps:/app/maps
      - ./data/nagvis.db:/app/nagvis.db
    environment:
      - MAPS_DIR=/app/maps
      - DATABASE_URL=sqlite+aiosqlite:////app/nagvis.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_ORIGINS=http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes: {}
