# OrbVis Apache reverse proxy configuration
#
# Required modules:
#   a2enmod proxy proxy_http proxy_wstunnel rewrite
#
# Installation:
#   sudo cp contrib/orbvis-apache.conf /etc/apache2/conf-available/orbvis.conf
#   sudo a2enconf orbvis
#   sudo systemctl reload apache2

# WebSocket proxy (must appear before the /orbvis/api/ block)
ProxyPass        /orbvis/api/v1/ws/  ws://127.0.0.1:8080/api/v1/ws/
ProxyPassReverse /orbvis/api/v1/ws/  ws://127.0.0.1:8080/api/v1/ws/

# API proxy
ProxyPass        /orbvis/api/  http://127.0.0.1:8080/api/
ProxyPassReverse /orbvis/api/  http://127.0.0.1:8080/api/

# Frontend SPA
ProxyPass        /orbvis/  http://127.0.0.1:3000/orbvis/
ProxyPassReverse /orbvis/  http://127.0.0.1:3000/orbvis/

# Redirect /orbvis → /orbvis/
RedirectMatch ^/orbvis$ /orbvis/
