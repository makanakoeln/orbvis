server {
    listen 80;
    server_name _;

    # Backend caps backgrounds at 10 MB and icons at 2 MB. Keep the proxy
    # ceiling slightly above the largest backend limit so the API gets to
    # return its structured 413 instead of nginx returning a raw HTML one.
    client_max_body_size 12M;

    # Redirect /orbvis to /orbvis/
    location = /orbvis {
        return 301 $scheme://$http_host/orbvis/;
    }

    # Proxy WebSocket (must be before /orbvis/api/)
    location /orbvis/api/v1/ws/ {
        proxy_pass http://backend:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy API requests to backend
    location /orbvis/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend mounts uploaded board backgrounds at /boards/backgrounds (under
    # the root of the FastAPI app, not /api/). The SPA builds the URL as
    # ${BASE_URL}boards/backgrounds/<file>, so without an explicit proxy the
    # SPA fallback would intercept and return index.html as text/html for
    # every <img src=...> request.
    location /orbvis/boards/backgrounds/ {
        proxy_pass http://backend:8000/boards/backgrounds/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend mounts the icon set (built-in + uploaded SVGs/PNGs) at /images.
    # The /api/v1/images JSON returns relative URLs like "images/<file>" and
    # the SPA renders them via <img :src="${BASE_URL}${url}">. Without this
    # proxy the SPA fallback intercepts and serves index.html, so the operator
    # sees a broken Images page and grey object icons.
    location /orbvis/images/ {
        proxy_pass http://backend:8000/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend SPA
    location /orbvis/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /orbvis/index.html;
    }
}
